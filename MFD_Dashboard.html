<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantua Fire Department – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy-950:#080e1e; --navy-900:#0f172a; --navy-800:#1e293b; --navy-700:#334155;
    --red:#dc2626; --gold:#f59e0b; --ink-100:#f1f5f9; --ink-500:#94a3b8;
  }
  html, body { height:100%; font-family:'Inter', system-ui, sans-serif; background:var(--navy-950); color:var(--ink-100); }
  #mfdAppContent { height:100%; display:flex; flex-direction:column; }
  header { background:linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 100%); border-bottom:3px solid var(--red); flex-shrink:0; }
  .header-inner { padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .shield { flex-shrink:0; width:38px; height:44px; }
  .header-text-block { flex:1; min-width:0; }
  .header-dept { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-500); }
  .header-title { font-size:17px; font-weight:900; line-height:1.2; }
  .header-subtitle { font-size:11px; color:var(--red); font-weight:600; margin-top:2px; }
  .header-back { display:flex; align-items:center; gap:6px; flex-shrink:0; padding:6px 14px; border-radius:7px; background:rgba(255,255,255,.05);
    border:1px solid var(--navy-700); color:var(--ink-500); font-size:12px; font-weight:600; text-decoration:none; transition:all .2s; }
  .header-back:hover { background:rgba(255,255,255,.09); color:var(--ink-100); border-color:#475569; }
  .module-tab-bar { display:flex; align-items:center; gap:4px; padding:10px 24px 0; background:var(--navy-950); border-bottom:1px solid var(--navy-700);
    flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .module-tab { display:flex; align-items:center; gap:8px; white-space:nowrap; padding:10px 18px; border-radius:8px 8px 0 0; border:none;
    border-bottom:3px solid transparent; font-size:.875rem; font-weight:700; color:var(--ink-500); background:transparent; cursor:pointer;
    transition:all .2s; font-family:inherit; flex:0 0 auto; }
  .module-tab:hover { color:var(--ink-100); background:rgba(255,255,255,.04); }
  .module-tab.active { color:var(--red); background:rgba(220,38,38,.1); border-bottom:3px solid var(--red); }
  .frame-wrap { position:relative; flex:1; min-height:0; }
  .dash-frame { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:var(--navy-950); }
  .dash-frame.active { display:block; }
  .frame-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-500); font-size:13px;
    letter-spacing:.05em; text-transform:uppercase; font-weight:600; background:var(--navy-950); pointer-events:none; }
  @media (max-width:640px) {
    .header-inner { padding:12px 14px; flex-wrap:wrap; }
    .module-tab-bar { padding:8px 10px 0; }
    .module-tab { padding:9px 12px; }
    .frame-wrap { padding-bottom:0; }
  }
</style>
</head>
<body>
<div id="mfdAuthGate"></div>
<div id="mfdAppContent" style="display:none;">

<header>
  <div class="header-inner">
    <svg class="shield" viewBox="0 0 64 74" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 2 L60 14 L60 36 C60 54 32 72 32 72 C32 72 4 54 4 36 L4 14 Z" fill="rgba(220,38,38,0.15)" stroke="rgba(220,38,38,0.5)" stroke-width="1.5"/>
      <path d="M32 56 C24 52 20 44 24 36 C26 40 30 38 29 32 C33 36 35 30 32 24 C38 28 42 36 40 44 C44 40 44 34 42 30 C48 36 50 46 44 54 C42 58 36 60 32 56Z" fill="rgba(248,113,113,0.85)"/>
    </svg>
    <div class="header-text-block">
      <div class="header-dept">Mantua Township</div>
      <div class="header-title">📊 Dashboard</div>
      <div class="header-subtitle">Call Outs, Roster, Budget &amp; Rental Inspections</div>
    </div>
    <a href="index.html" class="header-back">← Back to Hub</a>
  </div>
</header>

<div class="module-tab-bar" role="tablist">
  <button type="button" class="module-tab active" data-target="timecards" role="tab">⏱ Call Outs</button>
  <button type="button" class="module-tab" data-target="roster" role="tab">🧑‍🚒 Roster</button>
  <button type="button" class="module-tab" data-target="budget" role="tab">💰 Budget &amp; Finance</button>
  <button type="button" class="module-tab" data-target="rental" role="tab">🏠 Rental Inspections</button>
</div>

<div class="frame-wrap">
  <div class="frame-loading" id="loading">Loading…</div>
  <iframe class="dash-frame" id="frame-timecards" title="Call Outs Dashboard"></iframe>
  <iframe class="dash-frame" id="frame-roster" title="Roster Dashboard"></iframe>
  <iframe class="dash-frame" id="frame-budget" title="Budget Dashboard"></iframe>
  <iframe class="dash-frame" id="frame-rental" title="Rental Inspections Dashboard"></iframe>
</div>

<script>
/* Each tab shows the dashboard from its module in "dashboard-only" mode (?dash=...).
   The dashboards were moved out of their modules; the data is the same shared data. A tab loads
   the first time it is opened. */
var SOURCES = {
  timecards: 'MFD_RosterTimecards.html?dash=timecards',
  roster:    'MFD_RosterTimecards.html?dash=roster',
  budget:    'MFD_Budget.html?dash=1',
  rental:    'MFD_RentalInspections.html?dash=1'
};
var frames = {}, loaded = {};
Object.keys(SOURCES).forEach(function (k) { frames[k] = document.getElementById('frame-' + k); loaded[k] = false; });
var TAB_KEY = 'mfd_dashboard_tab';

function showTab(name) {
  if (!frames[name]) name = 'timecards';
  Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('active', k === name); });
  document.querySelectorAll('.module-tab').forEach(function (b) { b.classList.toggle('active', b.dataset.target === name); });
  try { sessionStorage.setItem(TAB_KEY, name); } catch (e) {}
  if (!loaded[name]) {
    loaded[name] = true;
    var ld = document.getElementById('loading'); ld.style.display = 'flex';
    frames[name].addEventListener('load', function () { ld.style.display = 'none'; }, { once: true });
    frames[name].src = SOURCES[name];
  } else {
    document.getElementById('loading').style.display = 'none';
  }
}
document.querySelectorAll('.module-tab').forEach(function (b) {
  b.addEventListener('click', function () { showTab(b.dataset.target); });
});

/* Start only after sign-in so each embedded dashboard sees the signed-in session. */
function start() {
  var qs = new URLSearchParams(location.search), want = qs.get('tab');
  if (!want) { try { want = sessionStorage.getItem(TAB_KEY); } catch (e) {} }
  showTab(want);
}
var started = false;
function startOnce() { if (started) return; started = true; start(); }
window.addEventListener('mfd-auth-ready', startOnce);
</script>

</div>
<script src="mfd-sync.js"></script>
<script src="mfdauth.js"></script>
</body>
</html>
