<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {

  body { display: flex; flex-direction: column; }

  .header-dept {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-500);
  }

  .header-title { font-size: 17px; font-weight: 900; color: var(--ink-100); line-height: 1.2; }

  .header-subtitle { font-size: 11px; color: var(--red); font-weight: 600; margin-top: 2px; }

  .header-back {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 7px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--navy-700);
    color: var(--ink-500);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all .2s;
  }
  .header-back:hover { background: rgba(255,255,255,0.09); color: var(--ink-100); border-color: #475569; }

  .module-tab-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 24px 0;
    background: var(--navy-950);
    border-bottom: 1px solid var(--navy-700);
    flex-shrink: 0;
  }

  .module-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    width: auto;
    margin: 0;
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    border: none;
    border-bottom: 3px solid transparent;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--ink-500);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .module-tab:hover { color: var(--ink-100); background: rgba(255,255,255,0.04); }
  .module-tab.active {
    color: var(--red);
    background: rgba(220,38,38,0.1);
    border-bottom: 3px solid var(--red);
  }

  .frame-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  .module-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }
  .module-frame.active { display: block; }

  .frame-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-500);
    font-size: 13px;
    letter-spacing: .05em;
    text-transform: uppercase;
    font-weight: 600;
    background: var(--navy-950);
    pointer-events: none;
  }

   scripts) is embedded below, base64-encoded, and loaded into its own
   isolated iframe via srcdoc. This keeps the two apps' markup, CSS and JS
   completely independent (no id/class/function collisions between them),
   while still shipping as a single .html file. Because srcdoc content
   inherits this page's origin, localStorage (mfd_members_v5,
   mantua_fd_timecards_v1, and the shared auth session from mfd-auth.js) is
   still shared exactly as it is between separate pages today. */

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const frames = {
  timecards: document.getElementById('frame-timecards'),
  roster: document.getElementById('frame-roster'),
};
const loaders = {
  timecards: document.getElementById('loading-timecards'),
  roster: document.getElementById('loading-roster'),
};
const sources = { timecards: TIMECARDS_B64, roster: ROSTER_B64 };
const loaded = { timecards: false, roster: false };

function loadModule(name) {
  if (loaded[name]) return;
  loaded[name] = true;
  frames[name].addEventListener('load', () => { loaders[name].style.display = 'none'; }, { once: true });
  frames[name].srcdoc = b64ToUtf8(sources[name]);
}

function showModule(name) {
  Object.keys(frames).forEach(key => {
    const isActive = key === name;
    frames[key].classList.toggle('active', isActive);
    document.getElementById('tab-' + key).classList.toggle('active', isActive);
  });
  loadModule(name);
}

document.getElementById('tab-timecards').addEventListener('click', () => showModule('timecards'));
document.getElementById('tab-roster').addEventListener('click', () => showModule('roster'));

// Deep link from a QR label, e.g. ?module=timecards&tab=timecards opens the
// Time Card module straight on its Timecards (new entry) tab.
const qs = new URLSearchParams(location.search);
const wantModule = frames[qs.get('module')] ? qs.get('module') : 'timecards';
const wantTab = qs.get('tab');
if (wantTab) {
  frames[wantModule].addEventListener('load', () => {
    try {
      const b = frames[wantModule].contentDocument.querySelector('button.tab[data-tab="' + wantTab.replace(/[^a-z0-9_-]/gi, '') + '"]');
      if (b) b.click();
    } catch (e) { /* ignore */ }
  }, { once: true });
}

// Load the default (first) tab immediately; the other loads on first click.
showModule(wantModule);
</script>
